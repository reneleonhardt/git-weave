name: CI

on:
  push:
    branches: [main, ci/combined-CI]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Git identity for tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: nextest@0.9.152
      - name: Run workspace tests
        shell: bash
        run: |
          sysctl hw.logicalcpu hw.memsize
          args=(--profile ci --cargo-quiet --locked --workspace --tests --status-level none)
          time cargo nextest run "${args[@]}" --no-run
          for threads in num-cpus 6 num-cpus; do
            echo "::group::Test threads: $threads"
            time cargo nextest run "${args[@]}" --test-threads "$threads"
            python3 - <<'REPORT'
          import hashlib, heapq, xml.etree.ElementTree as ET
          suites = ET.parse("target/nextest/ci/junit.xml").findall("testsuite")
          cases = [(s.get("name"), c.get("name"), float(c.get("time", 0)))
                   for s in suites for c in s.findall("testcase")]
          names = '\n'.join(sorted(f"{suite}/{name}" for suite, name, _ in cases))
          print(len(cases), "tests", hashlib.sha256(names.encode()).hexdigest())
          for suite, name, seconds in heapq.nlargest(15, cases, key=lambda row: row[2]):
              print(f"{seconds:5.2f}s {suite} {name}")
          REPORT
            echo "::endgroup::"
          done
      - name: Verify both public merge suites ran
        shell: python
        run: |
          import xml.etree.ElementTree as ET

          missing = {"weave-core::public_properties", "weave-driver::public_properties"}
          for _, suite in ET.iterparse("target/nextest/ci/junit.xml"):
              if suite.tag != "testsuite":
                  continue
              name = suite.get("name")
              if name in missing and any(case.find("skipped") is None for case in suite.iterfind("testcase")):
                  missing.remove(name)
              suite.clear()
          if missing:
              raise SystemExit("No tests ran in " + ", ".join(sorted(missing)))
      - name: Check out YAML fixtures
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: yaml/yaml-test-suite
          ref: 6e6c296ae9c9d2d5c4134b4b64d01b29ac19ff6f # data-2022-01-17
          path: .local/yaml-test-suite
          persist-credentials: false
      - name: Check YAML parsing and merge values
        if: runner.os == 'Linux'
        env:
          YAML_TEST_SUITE: ${{ github.workspace }}/.local/yaml-test-suite
        run: >-
          cargo nextest run --cargo-quiet --locked --workspace --tests --status-level none
          --run-ignored only --no-tests fail
          -E 'package(=weave-core) & test(=dataunion::yaml_suite::upstream_yaml_fixtures)'
      - name: Run doctests
        run: cargo test --quiet --locked --workspace --doc
